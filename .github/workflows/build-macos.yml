name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macOS 26 + Xcode 26 SDK, so the panel gets real Liquid Glass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift run -c release ClimateBar --selftest
      - run: ./Scripts/bundle.sh
      - run: ditto -c -k --keepParent build/ClimateBar.app ClimateBar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClimateBar
          path: ClimateBar.zip
